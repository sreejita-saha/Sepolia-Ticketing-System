<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src  'self' https://cdn.jsdelivr.net 'unsafe-inline';
      style-src   'self';
      connect-src https://sepolia.drpc.org https://sepolia.etherscan.io https://cdn.jsdelivr.net ws://127.0.0.1:5500;
      img-src     'none';
      font-src    'none';
      frame-src   'none';
      object-src  'none';
      base-uri    'none';
      form-action 'none';
    "
  />
  <title>{{title}} — Sepolia Ticketing</title>
  <link rel="stylesheet" href="css/main.css" />
  {{additionalStyles}}
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-logo">🎟 Sepolia Ticketing</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link {{nav_events}}">Events</a>
      <a href="create-wallet.html" class="nav-link {{nav_create_wallet}}">Create Wallet</a>
      <a href="balance.html" class="nav-link {{nav_balance}}">My Tickets</a>
      <a href="buy.html" class="nav-link {{nav_buy}}">Buy Tickets</a>
      <a href="transfer.html" class="nav-link {{nav_transfer}}">Transfer</a>
    </nav>
  </header>

  <main class="page-container">
    {{content}}
  </main>

  <footer class="site-footer">
    <p>Sepolia Ticketing System — Testnet only. All transactions are on the Sepolia blockchain.</p>
  </footer>

  {{scripts}}

</body>
</html>
